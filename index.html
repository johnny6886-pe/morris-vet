document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"flex:none\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg>Protocolo de bioseguridad<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"position:relative;min-width:0\">\n      <svg sc-camel-view-box=\"0 0 120 120\" aria-hidden=\"true\" style=\"position:absolute;left:-24px;bottom:-20px;width:100px;z-index:2\"><path d=\"M60 6c8 20 26 30 48 30-20 12-28 32-24 54-16-14-38-16-56-6 8-20 2-42-16-54 22 2 40-6 48-24Z\" fill=\"#ff673e\"><\u002Fpath><\u002Fsvg>\n      <div style=\"position:relative;border-radius:32px;overflow:hidden;background:#ffcee4;aspect-ratio:4/3.4;box-shadow:0 24px 60px rgba(19,101,64,.16)\">\n        <image-slot id=\"mv-hero-a\" shape=\"rect\" placeholder=\"Foto: cirujano de Morris Vet operando en una clínica aliada\" style=\"width:100%;height:100%\" src=\"a77f561a-61c7-4909-b30d-c9a258e4fef5\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <img src=\"786258e8-d461-42e4-9a53-ff2e0199360f\" alt=\"\" style=\"position:absolute;top:-18px;right:-10px;width:clamp(84px,11vw,124px);z-index:3;filter:drop-shadow(0 10px 20px rgba(19,101,64,.18))\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:clamp(42px,6vw,76px) clamp(16px,4vw,56px) 0;background:#136540;border-radius:32px;padding:clamp(28px,3.6vw,46px) clamp(22px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(20px,2.4vw,32px)\">\n  <div>\n    <div style=\"font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(38px,4.4vw,56px);line-height:1;color:#ffd12f\">4<\u002Fdiv>\n    <p style=\"color:#fffaea;font-size:15.5px;line-height:1.4;margin:12px 0 0\">áreas quirúrgicas cubiertas, de esterilizaciones a urgencias<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(38px,4.4vw,56px);line-height:1;color:#ffd12f\">Hoy<\u002Fdiv>\n    <p style=\"color:#fffaea;font-size:15.5px;line-height:1.4;margin:12px 0 0\">respondemos y coordinamos el caso el mismo día<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(38px,4.4vw,56px);line-height:1;color:#ffd12f\">0<\u002Fdiv>\n    <p style=\"color:#fffaea;font-size:15.5px;line-height:1.4;margin:12px 0 0\">inversión en equipamiento: llevamos instrumental e insumos<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(38px,4.4vw,56px);line-height:1;color:#ffd12f\">100%<\u002Fdiv>\n    <p style=\"color:#fffaea;font-size:15.5px;line-height:1.4;margin:12px 0 0\">del vínculo con el cliente se queda en tu clínica<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"especialidades\" style=\"padding:clamp(54px,7.5vw,104px) clamp(16px,4vw,56px) 0;scroll-margin-top:100px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid #136540;padding-bottom:22px\">\n    <div style=\"min-width:0\">\n      <span style=\"display:block;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0dbd67\">Especialidades<\u002Fspan>\n      <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1;color:#136540;margin:12px 0 0;letter-spacing:-.01em\">Cuatro áreas donde<br>más nos llaman<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:16.5px;line-height:1.5;color:#1b2b23;max-width:40ch;margin:0\">Cobertura quirúrgica pensada para los casos que normalmente tendrías que derivar a otra clínica.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px;margin-top:26px\">\n    <article style=\"background:#ffd12f;border-radius:28px;padding:28px 26px;display:flex;flex-direction:column;gap:12px\">\n      <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#136540\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 3.5 21 10l-8.5 8.5a5 5 0 0 1-7-7L14.5 3.5Z\"><\u002Fpath><path d=\"M8 8 3 3\"><\u002Fpath><path d=\"m14 14 3 3\"><\u002Fpath><\u002Fsvg>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;line-height:1.08;color:#136540;margin:4px 0 0\">Cirugías de tejidos blandos<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Esterilización (ovariohisterectomía y orquiectomía), remoción de masas y tumores, cirugías gastrointestinales, hernias, piometra y cesáreas programadas.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"background:#ff673e;border-radius:28px;padding:28px 26px;display:flex;flex-direction:column;gap:12px\">\n      <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fffaea\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h7l-1 8 9-12h-7l1-8Z\"><\u002Fpath><\u002Fsvg>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;line-height:1.08;color:#fffaea;margin:4px 0 0\">Urgencias quirúrgicas<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#fffaea;margin:0\">Cesáreas de emergencia y torsión gástrica: llegamos a tu clínica el mismo día para operar sin mover al paciente.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"background:#ffcee4;border-radius:28px;padding:28px 26px;display:flex;flex-direction:column;gap:12px\">\n      <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#136540\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5.5C10.5 4 8.8 3.4 7.2 4 5.2 4.7 4 6.8 4 9.4c0 3 1.2 5.3 2 8 .5 1.8 1 3.1 2 3.1 1.2 0 1.4-1.6 2-3.6.4-1.3.9-2.4 2-2.4s1.6 1.1 2 2.4c.6 2 .8 3.6 2 3.6 1 0 1.5-1.3 2-3.1.8-2.7 2-5 2-8C20 6.8 18.8 4.7 16.8 4c-1.6-.6-3.3 0-4.8 1.5Z\"><\u002Fpath><\u002Fsvg>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;line-height:1.08;color:#136540;margin:4px 0 0\">Odontología quirúrgica<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Extracciones simples y profilaxis dental bajo anestesia.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"background:#35c5f4;border-radius:28px;padding:28px 26px;display:flex;flex-direction:column;gap:12px\">\n      <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#136540\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><path d=\"M11 8v6\"><\u002Fpath><\u002Fsvg>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;line-height:1.08;color:#136540;margin:4px 0 0\">Procedimientos diagnósticos<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Ecografía, endoscopía y biopsias guiadas, según el caso y la disponibilidad de equipo.<\u002Fp>\n    <\u002Farticle>\n  <\u002Fdiv>\n  <p style=\"margin:22px 0 0;font-size:16.5px;color:#136540;font-weight:500\">¿Tu clínica necesita algo fuera de esta lista? <a href=\"#contacto\" style=\"text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px\">Escríbenos y lo evaluamos.<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"como-funciona\" style=\"padding:clamp(54px,7.5vw,104px) clamp(16px,4vw,56px) 0;scroll-margin-top:100px\">\n  <span style=\"display:block;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0dbd67\">Cómo funciona<\u002Fspan>\n  <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1;color:#136540;margin:12px 0 0;letter-spacing:-.01em\">Cuatro pasos, de la consulta al alta<\u002Fh2>\n  <ol style=\"list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 24px;background:#fffaea\">\n    <li style=\"background:#fffaea;padding:26px 0 30px;display:flex;flex-direction:column;gap:10px;border-top:2px solid #136540\">\n      <span style=\"width:42px;height:42px;border-radius:999px;background:#0dbd67;color:#fffaea;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center\">01<\u002Fspan>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:500;font-size:21px;line-height:1.1;color:#136540;margin:6px 0 0\">Cuéntanos el caso<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Nos escribes con el diagnóstico o sospecha y la disponibilidad de tu clínica. Si es una urgencia, mejor llámanos directamente.<\u002Fp>\n    <\u002Fli>\n    <li style=\"background:#fffaea;padding:26px 0 30px;display:flex;flex-direction:column;gap:10px;border-top:2px solid #136540\">\n      <span style=\"width:42px;height:42px;border-radius:999px;background:#0dbd67;color:#fffaea;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center\">02<\u002Fspan>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:500;font-size:21px;line-height:1.1;color:#136540;margin:6px 0 0\">Coordinamos fecha y hora<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Te respondemos de inmediato con la cotización, las fechas y el cirujano asignado.<\u002Fp>\n    <\u002Fli>\n    <li style=\"background:#fffaea;padding:26px 0 30px;display:flex;flex-direction:column;gap:10px;border-top:2px solid #136540\">\n      <span style=\"width:42px;height:42px;border-radius:999px;background:#0dbd67;color:#fffaea;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center\">03<\u002Fspan>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:500;font-size:21px;line-height:1.1;color:#136540;margin:6px 0 0\">Operamos en tu clínica<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Llegamos con instrumental, insumos y protocolo de bioseguridad. Usamos el quirófano de tu clínica.<\u002Fp>\n    <\u002Fli>\n    <li style=\"background:#fffaea;padding:26px 0 30px;display:flex;flex-direction:column;gap:10px;border-top:2px solid #136540\">\n      <span style=\"width:42px;height:42px;border-radius:999px;background:#0dbd67;color:#fffaea;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center\">04<\u002Fspan>\n      <h3 style=\"font-family:Fredoka,sans-serif;font-weight:500;font-size:21px;line-height:1.1;color:#136540;margin:6px 0 0\">Dejamos las indicaciones<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.5;color:#1b2b23;margin:0\">Indicaciones de seguimiento post-operatorio para tu equipo y el dueño de la mascota, y quedamos disponibles por WhatsApp para cualquier duda.<\u002Fp>\n    <\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<section id=\"cobertura\" style=\"padding:clamp(54px,7.5vw,104px) clamp(16px,4vw,56px) 0;scroll-margin-top:100px\">\n  <div style=\"background:#ffd12f;border-radius:32px;padding:clamp(28px,3.6vw,52px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(26px,3.5vw,48px);align-items:start\">\n    <div style=\"min-width:0\">\n      <span style=\"display:block;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#136540\">Cobertura<\u002Fspan>\n      <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(28px,3.6vw,46px);line-height:1.02;color:#136540;margin:12px 0 0;letter-spacing:-.01em\">Lima Moderna, con respuesta rápida dentro de la zona<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.5;color:#1b2b23;margin:18px 0 0;max-width:44ch\">Un corredor compacto nos permite llegar rápido, coordinar mejor los horarios y priorizar las urgencias.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"min-width:0\">\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:9px\">\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">San Miguel<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Magdalena del Mar<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Pueblo Libre<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Jesús María<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Lince<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Miraflores<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">San Isidro<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">San Borja<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Surquillo<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Surco<\u002Fli>\n        <li style=\"background:#fffaea;color:#136540;font-size:15.5px;font-weight:500;padding:10px 17px;border-radius:999px\">Barranco<\u002Fli>\n      <\u002Ful>\n      <p style=\"margin:20px 0 0;font-size:16px;color:#136540;font-weight:500\">¿Tu clínica está fuera de esta zona? <a href=\"#contacto\" style=\"text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px\">Escríbenos igual, evaluamos
